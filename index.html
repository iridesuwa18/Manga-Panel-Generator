<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manga Panel Generator</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/planner.css">
</head>
<body>

<!-- ── TOP BAR ── -->
<header id="topbar">
  <span class="app-logo"><strong>Manga</strong> Panel Gen</span>
  <button id="plannerBtn" class="icon-btn" aria-label="Open manga planner" title="Planner" onclick="openPlanner()">
    <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="15" height="15" rx="1.5"></rect>
      <line x1="2.5" y1="10.4" x2="17.5" y2="10.4"></line>
      <line x1="9.7" y1="2.5" x2="9.7" y2="10.4"></line>
      <line x1="2.5" y1="14.5" x2="12.8" y2="14.5"></line>
      <line x1="12.8" y1="10.4" x2="12.8" y2="17.5"></line>
    </svg>
  </button>
  <span id="autosaveLabel" class="chip"></span>
  <button id="mobHamburgerBtn" aria-label="Open menu" onclick="openMobileMenu()">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- ── MOBILE SCROLL WRAPPER ── -->
<div id="mobileScroll">

  <!-- ── WORKSPACE (canvas + desktop rail + desktop drawer) ── -->
  <main id="workspace">

    <!-- CANVAS -->
    <div id="canvasWrap">
      <div id="canvasArea">
        <div id="canvasInner">
          <div class="empty-state" id="emptyState">
            <p>
              Import panel data or add rows manually, then generate.
              <span class="hint">Ctrl+scroll zoom · Space+drag pan · Ctrl+Z undo</span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- DESKTOP RIGHT RAIL -->
    <nav id="rightRail">
      <div class="rail-row" data-row="export" data-short="EXP">
        <button onclick="openDrawer('export')">EXPORT</button>
      </div>
      <div class="rail-row" data-row="pages" data-short="PG">
        <button onclick="openDrawer('pages')">PAGES</button>
      </div>
      <div class="rail-row" data-row="bubbles" data-short="BUB">
        <button onclick="openDrawer('bubbles')">BUBBLES</button>
      </div>
      <div class="rail-row" data-row="layers" data-short="LYR">
        <button onclick="openDrawer('layers')">LAYERS</button>
      </div>
      <div class="rail-row" data-row="preview" data-short="PRV">
        <button onclick="openDrawer('preview')">PREVIEW</button>
      </div>
    </nav>

    <!-- DESKTOP DRAWER -->
    <aside id="drawer"></aside>

  </main>

  <!-- ── MOBILE FULL-SCREEN MENU (opened by the hamburger button) ── -->
  <div id="mobMenuOverlay">
    <div class="mob-menu-header">
      <span class="mob-menu-title">Menu</span>
      <button id="mobMenuCloseBtn" aria-label="Close menu" onclick="closeMobileMenu()">&times;</button>
    </div>

    <!-- ── MOBILE ACCORDION NAV ── -->
    <nav id="mobileNav">
    <div class="mob-row" data-row="export">
      <button class="mob-row-btn" onclick="openMobileSection('export')">
        <span>Import / Export</span><span class="mob-chevron">›</span>
      </button>
      <div class="mob-drawer" id="mob-export"></div>
    </div>
    <div class="mob-row" data-row="pages">
      <button class="mob-row-btn" onclick="openMobileSection('pages')">
        <span>Pages &amp; Panels</span><span class="mob-chevron">›</span>
      </button>
      <div class="mob-drawer" id="mob-pages"></div>
    </div>
    <div class="mob-row" data-row="bubbles">
      <button class="mob-row-btn" onclick="openMobileSection('bubbles')">
        <span>Bubbles &amp; Text</span><span class="mob-chevron">›</span>
      </button>
      <div class="mob-drawer" id="mob-bubbles"></div>
    </div>
    <div class="mob-row" data-row="layers">
      <button class="mob-row-btn" onclick="openMobileSection('layers')">
        <span>Layers</span><span class="mob-chevron">›</span>
      </button>
      <div class="mob-drawer" id="mob-layers"></div>
    </div>
    <div class="mob-row" data-row="preview">
      <button class="mob-row-btn" onclick="openMobileSection('preview')">
        <span>Preview / Generate</span><span class="mob-chevron">›</span>
      </button>
      <div class="mob-drawer" id="mob-preview"></div>
    </div>
    </nav>
  </div>

</div><!-- /mobileScroll -->

<!-- ── MANGA PLANNER (full-screen overlay, separate interface) ── -->
<div id="plannerOverlay">
  <div class="planner-header">
    <span class="planner-title"><strong>Manga</strong> Planner</span>
    <div class="planner-header-actions">
      <input type="file" id="plannerImportInput" accept=".csv,.tsv,.xlsx,.xls" style="display:none" onchange="window.handlePlannerImport?.(event)">
      <button class="btn small" onclick="document.getElementById('plannerImportInput').click()">&#8593; Import</button>
      <button class="btn small" onclick="window.exportPlannerCSV?.()">&#8595; CSV</button>
      <button class="btn small" onclick="window.exportPlannerXLSX?.()">&#8595; Excel</button>
      <button id="plannerCloseBtn" aria-label="Close planner" onclick="closePlanner()">&times;</button>
    </div>
  </div>
  <div class="planner-body" id="plannerBody"><!-- rendered by js/planner.js --></div>
</div>

<div id="toast" aria-live="polite"></div>

<!-- Scripts -->
<script src="js/state.js"></script>
<script src="js/undo.js"></script>
<script src="js/canvas.js"></script>
<script src="js/generate.js"></script>
<script src="js/data.js"></script>
<script src="js/pages.js"></script>
<script src="js/bubbles.js"></script>
<script src="js/text.js"></script>
<script src="js/panels.js"></script>
<script src="js/layers.js"></script>
<script src="js/export.js"></script>
<script src="js/github.js"></script>
<script src="js/ui.js"></script>
<script src="js/init.js"></script>
<script src="js/mobile.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
